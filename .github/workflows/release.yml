name: Release Thumbnails

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          zip -r "dist/Thumbnails-${VERSION}.iinaplgz" \
            Info.json \
            main.js \
            global.js \
            preferences.html \
            about.html \
            README.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" \
          "dist/Thumbnails-${GITHUB_REF_NAME#v}.iinaplgz" \
          --generate-notes \
          --title "Thumbnails ${GITHUB_REF_NAME#v}"
